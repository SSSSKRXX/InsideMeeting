<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>InsideMeeting</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: grid; place-items: center;
    background: #0e1116; color: #e6edf3;
    font: 14px/1.7 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  .card { width: 440px; padding: 32px; }
  h1 { margin: 0 0 6px; font-size: 24px; }
  p.sub { margin: 0 0 24px; color: #8b97a6; font-size: 13px; }
  label { display: block; font-size: 13px; color: #8b97a6; margin-bottom: 6px; }
  input {
    width: 100%; background: #1c232d; border: 1px solid #2a3341; color: #e6edf3;
    padding: 11px 12px; border-radius: 8px; font: inherit;
  }
  input:focus { outline: none; border-color: #3b82f6; }
  button {
    width: 100%; margin-top: 16px; background: #3b82f6; border: 0; color: #fff;
    padding: 11px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #2563eb; }
  .err { color: #fca5a5; font-size: 13px; margin-top: 12px; min-height: 20px; }
  .tip { color: #8b97a6; font-size: 12px; margin-top: 20px; border-top: 1px solid #2a3341; padding-top: 16px; }
  code { background: #1c232d; padding: 1px 6px; border-radius: 4px; }
</style>
</head>
<body>
  <div class="card">
    <h1>InsideMeeting</h1>
    <p class="sub">第一次使用，先填入你们的会议服务器地址</p>

    <label>服务器地址</label>
    <input id="url" placeholder="https://macmini.你的tailnet.ts.net:8443" autofocus />
    <button id="go">连接</button>
    <div class="err" id="err"></div>

    <div class="tip">
      地址由管理员提供，通常形如 <code>https://xxx.ts.net:8443</code>。<br />
      连不上的话，先确认 Tailscale 已经启动并显示 Connected。
    </div>
  </div>

<script>
  const input = document.getElementById('url');
  const err = document.getElementById('err');
  const go = document.getElementById('go');

  async function submit() {
    err.textContent = '';
    const v = input.value.trim();
    if (!v) return (err.textContent = '请填写服务器地址');
    go.disabled = true;
    go.textContent = '连接中…';
    try {
      await window.insideMeeting.setServerUrl(v);
    } catch (e) {
      err.textContent = e.message || String(e);
      go.disabled = false;
      go.textContent = '连接';
    }
  }

  go.onclick = submit;
  input.onkeydown = (e) => e.key === 'Enter' && submit();
</script>
</body>
</html>
