# coturn 配置 —— 只有「跨网络开会」（有人在家、在外网）时才需要。
# 纯公司内网使用可以完全跳过这一步。
#
# macOS 安装：brew install coturn
# 启动：      turnserver -c /path/to/turnserver.conf
# 开机自启：  brew services start coturn（需把本文件放到 $(brew --prefix)/etc/turnserver.conf）

listening-port=3478
# 如果 Mac mini 在路由器后面（几乎一定是），这里填内网 IP，external-ip 填公网 IP
listening-ip=0.0.0.0
# 把 1.2.3.4 换成你的公网 IP，192.168.1.20 换成 Mac mini 的内网 IP
# external-ip=1.2.3.4/192.168.1.20

# 中继端口范围，需要在路由器上一并做端口映射（UDP）
min-port=49160
max-port=49200

# 长期凭证模式
lt-cred-mech
realm=inside.meeting
# 用户名:密码，密码请改成长随机串，并同步写到 .env 的 TURN_USERNAME / TURN_PASSWORD
user=inside:CHANGE_ME_TO_A_LONG_RANDOM_STRING

fingerprint
no-cli
no-tlsv1
no-tlsv1_1

# 只做中继，不做别的，降低被滥用风险
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=224.0.0.0-255.255.255.255

log-file=stdout
verbose
