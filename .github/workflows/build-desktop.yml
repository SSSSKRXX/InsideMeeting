name: 打包桌面程序

# electron-builder 只能在对应平台打对应平台的包，
# 所以这里用 GitHub 的 macOS 和 Windows 两台机器分别打，再汇总到一个 Release。
# 你不需要有 Windows 电脑。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: 打完包后创建 Release
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            artifact: '*.dmg'
          - os: windows-latest
            name: Windows
            artifact: '*.exe'

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    # Windows 默认用 PowerShell，而 pwsh 会把 npm 写到 stderr 的警告当成错误，
    # 导致明明装成功了步骤却是红的。全部统一用 bash，两个平台行为一致。
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 环境自检
        run: |
          node -v && npm -v
          echo "--- 仓库根目录 ---"
          ls -la

      # 桌面 App 里内嵌了完整服务端，所以要先把前端构建出来
      - name: 安装根依赖
        run: npm install --no-audit --no-fund

      - name: 构建前端
        run: |
          npm run build
          echo "--- web/dist ---"
          ls -la web/dist

      - name: 安装依赖（桌面 App）
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: 复制服务端与前端到 App 内
        working-directory: desktop
        run: npm run prepare-bundle

      - name: 打包桌面 App
        working-directory: desktop
        run: npx electron-builder
        env:
          # 不做代码签名。要签名的话把证书配成 secrets，
          # 参考 https://www.electron.build/code-signing
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # 先把 electron-builder 到底产出了什么原样打出来，
      # 构建成功但产物没进 Release 时，这段日志是唯一的线索。
      - name: 列出构建产物
        shell: bash
        if: always()
        run: |
          echo "===== desktop/bundled ====="
          ls -la desktop/bundled/ 2>&1 || echo "（目录不存在）"
          echo "===== desktop/release ====="
          ls -la desktop/release/ 2>&1 || echo "（目录不存在）"

      - name: 收集产物
        shell: bash
        run: |
          mkdir -p out
          # 不用 find -exec，避免文件名里有空格或中文时出问题
          for d in desktop/release; do
            [ -d "$d" ] || continue
            for f in "$d"/*.dmg "$d"/*.exe "$d"/*.zip "$d"/*.AppImage; do
              [ -f "$f" ] && cp -v "$f" out/
            done
          done
          echo "===== 待上传 ====="
          ls -la out/
          # 一个都没有说明构建有问题，直接让这一步失败，别让它静默过去
          if [ -z "$(ls -A out/ 2>/dev/null)" ]; then
            echo "::error::${{ matrix.name }} 没有产出任何安装包"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: InsideMeeting-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 整理文件
        run: |
          mkdir -p release
          find dist -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \) -print0 \
            | while IFS= read -r -d '' f; do
                # 保险：万一还有空格，统一换成下划线。
                # v0.1.0 时 Windows 客户端就是因为文件名带空格没能进 Release。
                base=$(basename "$f" | tr ' ' '_')
                cp -v "$f" "release/$base"
              done
          echo "===== 将上传到 Release 的文件 ====="
          ls -lh release/
          echo "共 $(ls -1 release/ | wc -l) 个"

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## 下载

            | 你的系统 | 下载哪个 |
            |---|---|
            | macOS（Apple 芯片） | `InsideMeeting-*-arm64.dmg` |
            | macOS（Intel） | `InsideMeeting-*-x64.dmg` |
            | Windows | `InsideMeeting-*-x64.exe` |

            **一个 App 两种用法**，首次启动时选：

            - **这台电脑当服务器** —— App 内部会起一个完整的服务端。
              不用装 Node.js、不用装 ffmpeg、不用下载源码，证书自动生成。
              这台机器需要一直开着。
            - **我只是参会** —— 填一个别人给的服务器地址就行。

            ### 还是需要 Tailscale

            大家在不同网络时，所有设备要装 [Tailscale](https://tailscale.com/download)
            并登录同一个账号，否则连不通。这是网络层的事，App 代劳不了。

            全员在同一个局域网的话可以跳过。

            ### 参会其实不用装 App

            浏览器打开会议地址就能用。装 App 只解决一件事：
            共享屏幕时能带上系统声音（浏览器只能抓标签页音频）。

            ### 首次打开会被系统拦

            这些包没有代码签名，属于正常现象：

            - **macOS**：右键点图标 → 打开 → 再点一次「打开」
            - **Windows**：SmartScreen 提示时点「更多信息」→「仍要运行」
