name: 打包桌面程序

# electron-builder 只能在对应平台打对应平台的包，
# 所以这里用 GitHub 的 macOS 和 Windows 两台机器分别打，再汇总到一个 Release。
# 你不需要有 Windows 电脑。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: 打完包后创建 Release
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            artifact: '*.dmg'
          - os: windows-latest
            name: Windows
            artifact: '*.exe'

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---------- 会议客户端：两个平台都打 ----------
      - name: 安装依赖（桌面客户端）
        working-directory: desktop
        run: npm install

      - name: 打包桌面客户端
        working-directory: desktop
        run: npm run dist
        env:
          # 不做代码签名。要签名的话把证书配成 secrets，
          # 参考 https://www.electron.build/code-signing
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # ---------- 服务菜单栏程序：两个平台都打 ----------
      - name: 安装依赖（服务控制器）
        working-directory: tray
        run: npm install

      - name: 打包服务控制器
        working-directory: tray
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # 先把 electron-builder 到底产出了什么原样打出来，
      # 构建成功但产物没进 Release 时，这段日志是唯一的线索。
      - name: 列出构建产物
        shell: bash
        if: always()
        run: |
          echo "===== desktop/release ====="
          ls -la desktop/release/ 2>&1 || echo "（目录不存在）"
          echo "===== tray/release ====="
          ls -la tray/release/ 2>&1 || echo "（目录不存在）"

      - name: 收集产物
        shell: bash
        run: |
          mkdir -p out
          # 不用 find -exec，避免文件名里有空格或中文时出问题
          for d in desktop/release tray/release; do
            [ -d "$d" ] || continue
            for f in "$d"/*.dmg "$d"/*.exe "$d"/*.zip "$d"/*.AppImage; do
              [ -f "$f" ] && cp -v "$f" out/
            done
          done
          echo "===== 待上传 ====="
          ls -la out/
          # 一个都没有说明构建有问题，直接让这一步失败，别让它静默过去
          if [ -z "$(ls -A out/ 2>/dev/null)" ]; then
            echo "::error::${{ matrix.name }} 没有产出任何安装包"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: InsideMeeting-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 整理文件
        run: |
          mkdir -p release
          find dist -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \) -print0 \
            | while IFS= read -r -d '' f; do
                # 保险：万一还有空格，统一换成下划线。
                # v0.1.0 时 Windows 客户端就是因为文件名带空格没能进 Release。
                base=$(basename "$f" | tr ' ' '_')
                cp -v "$f" "release/$base"
              done
          echo "===== 将上传到 Release 的文件 ====="
          ls -lh release/
          echo "共 $(ls -1 release/ | wc -l) 个"

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## 下载

            | 你的系统 | 下载哪个 |
            |---|---|
            | macOS（参会用） | `InsideMeeting-*.dmg` |
            | Windows（参会用） | `InsideMeeting Setup *.exe` |
            | 服务器控制器 | 文件名带「服务」的那个 |

            **参会本来不需要装任何东西**，浏览器打开会议地址就能用。
            桌面客户端主要解决一件事：共享屏幕时能带上系统声音（浏览器只能抓标签页音频）。

            ### 首次打开会被系统拦

            这些包没有代码签名，属于正常现象：

            - **macOS**：右键点图标 → 打开 → 再点一次「打开」
            - **Windows**：SmartScreen 提示时点「更多信息」→「仍要运行」
